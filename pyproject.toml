[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "just_tiling"
version = "0.1.0"
description = "Tile scheduling for the JUST galaxy/galaxy cluster survey"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "healpy",
    "astropy",
    "scipy",
    "joblib",
]

[tool.setuptools]
package-dir = {"" = "py"}

[tool.setuptools.packages.find]
where = ["py"]
namespaces = true
